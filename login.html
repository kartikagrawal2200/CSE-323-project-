<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AeroSim Aviation</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231672ec'><path d='M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z'/></svg>">
</head>
<body>
  <!-- Background Image with Gradient Overlay -->
  <div class="page-bg bg-tarmac"></div>
  <div class="page-overlay"></div>

  <!-- Shared Header Navigation -->
  <div id="site-header"></div>

  <!-- Login Form Main Area -->
  <main id="main-content" class="main-content">
    <div class="auth-container">
      <div class="auth-card">
        <h1 class="auth-title">Login</h1>
        <p class="auth-subtitle">Welcome back! Please login to your account.</p>

        <form id="form-login" novalidate>
          <!-- Lockout alert banner (shown after 3 failed attempts) -->
          <div id="login-lockout-banner" class="auth-lockout-alert" style="display: none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="login-lockout-text">Too many attempts. Form locked for 30s.</span>
          </div>

          <!-- Inline error alert -->
          <div id="login-error-msg" class="auth-inline-error" style="display: none;"></div>

          <!-- Demo Account Quick Fill Card -->
          <div class="demo-credentials-card" id="demo-login-card">
            <div class="demo-cred-info">
              <span class="demo-badge">DEMO ACCOUNT</span>
              <span class="demo-cred-text">ID: <strong>User2244</strong> &bull; Pass: <strong>password123</strong></span>
            </div>
            <button type="button" class="btn-demo-fill" id="btn-fill-demo-login">
              Auto Fill Demo
            </button>
          </div>

          <!-- User ID Field -->
          <div class="form-group">
            <div class="input-with-icon">
              <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input 
                type="text" 
                class="auth-input" 
                id="login-userid" 
                placeholder="User ID or Phone" 
                required
                autocomplete="username"
              >
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <div class="input-with-icon">
              <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input 
                type="password" 
                class="auth-input" 
                id="login-password" 
                placeholder="Password" 
                required
                autocomplete="current-password"
              >
              <button type="button" class="btn-toggle-eye" aria-label="Toggle password visibility">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password Row -->
          <div class="auth-options-row">
            <label class="remember-me-label" for="login-remember-me">
              <input type="checkbox" id="login-remember-me">
              <span>Remember me</span>
            </label>
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-auth-submit" id="btn-login-submit">
            SUBMIT
          </button>

          <!-- Footer link -->
          <div class="auth-footer">
            Don't have an account? <a href="register.html">Register</a>
          </div>
        </form>
      </div>

      <!-- Airplane decorative graphic trail on bottom left matching image -->
      <div class="decor-airplane-trail">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="#1672ec" opacity="0.8">
          <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </svg>
        <svg width="120" height="24" viewBox="0 0 120 24" fill="none">
          <path d="M2 20 C 40 18, 80 8, 118 2" stroke="#1672ec" stroke-width="2" stroke-dasharray="4 4"/>
        </svg>
      </div>
    </div>
  </main>

  <!-- Shared Footer -->
  <div id="site-footer"></div>

  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
